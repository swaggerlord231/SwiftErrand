{% extends "errandApp/base_auth.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header"><h3 class="text-center font-weight-light my-4">Password Recovery</h3></div>
                <div class="card-body">
                    <p class="small text-muted mb-3">Enter the email address on your account and we will send you a link to reset your password.</p>
                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                        <div class="alert alert-danger">Please enter a valid email address.</div>
                        {% endif %}
                        <div class="form-floating mb-3">
                            <input class="form-control" id="id_email" type="email" name="email" placeholder="name@example.com" required>
                            <label for="id_email">Email address</label>
                        </div>
                        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                            <a class="small" href="{% url 'login' %}">Return to login</a>
                            <button type="submit" class="btn btn-primary">Send reset link</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
