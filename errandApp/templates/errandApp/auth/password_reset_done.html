{% extends "errandApp/base_auth.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header"><h3 class="text-center font-weight-light my-4">Check your email</h3></div>
                <div class="card-body">
                    <p class="text-muted">If an account exists with that email address, a password reset link has been sent. Check your inbox and spam folder.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
