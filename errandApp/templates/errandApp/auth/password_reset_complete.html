{% extends "errandApp/base_auth.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header"><h3 class="text-center font-weight-light my-4">Password changed</h3></div>
                <div class="card-body">
                    <p class="text-muted">Your password has been updated. You can now sign in with your new password.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
