{% extends "errandApp/base_auth.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header">
                    <h3 class="text-center font-weight-light my-4">Create Account</h3>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-floating mb-3 mb-md-0">
                                    <input class="form-control" name="first_name" type="text" placeholder="First name" value="{{ first_name }}" required>
                                    <label>First name</label>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input class="form-control" name="last_name" type="text" placeholder="Last name" value="{{ last_name }}" required>
                                    <label>Last name</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input class="form-control" name="username" type="text" placeholder="Username" value="{{ username }}" required>
                            <label> Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" name="email" type="email" placeholder="name@example.com" value="{{ email }}" required>
                            <label>Email address</label>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-floating mb-3 mb-md-0">
                                    <input class="form-control" name="password1" type="password" placeholder="Password" required>
                                    <label>Password</label>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-floating mb-3 mb-md-0">
                                    <input class="form-control" name="password2" type="password" placeholder="Confirm password" required>
                                    <label>Confirm Password</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_runner" id="is_runner">
                            <label class="form-check-label" for="is_runner">I want to earn money as a runner</label>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <div class="mt-4 mb-0">
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-block">
                                    Create Account
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="card-footer text-center py-3">
                    <div class="small">
                        <a href="{% url 'login' %}">Have an account? Go to login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
